<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-body">
        <div class="main-body-flex">
            <div>
                    <h1 class="main-text">Easy, Smooth Banking.</h1>
                    <p class="sub-text">Join us today to ensure your money counts and stays with you. 
                    </p>
            </div>
            <div class="login-div">
                <h2 class="logo"><span>P</span>AYSAL</h2>
                <div class="form">
                    <div>
                        <button class="option-button">Continue with Google</button>
                        <button class="option-button">Continue with Apple</button>
                    </div>
                    <div>
                        <label for="Name">Full Name:</label>
                        <hr>
                        <label for="Verification">Email or Phone Number:</label>
                        <hr>
                        <label for="Password">Password:</label>
                        <hr>
                        <label for="ConfirmPassword">Confirm Password:</label>
                        <hr>
                    </div>
                        <button class="sign-up-button">Sign Up</button>
                </div>
            </div>
            </div>
        </div>
</body>
</html>
