<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agile's Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="main-div">

    <header>
        <div>
            <p class="logo">AGILE</p>
        </div>

        <div class="nav-bar">
            <p class="nav-text">Home</p>
            <p class="nav-text">Shop</p>
            <p class="nav-text">Contact</p>
            <img class="search-icon" src="magnifying-glass-thin-svgrepo-com.svg" alt="">
        </div>
    </header>


    <section class="hero">
        <div class="hero-text">
           <h2>Beat Headphones</h2>
           <button class="buy-btn">Buy Now </button>
        </div>

        <div class="hero-img">
            <img src="pngwing.com (1).png" alt="headphones">
        </div>   
    </section>

 
    <section class="items-section">
        <h2 class="items-heading">Other Items</h2>

        <div class="items-container">

            <div class="item-card">
                <img src="pngwing.com (1).png" alt="product">
                <p class="item-name">Beta II Sets</p>
                <button class="item-btn">Buy Now</button>
            </div>

            <div class="item-card">
                <img src="pngwing.com.png" alt="product">
                <p class="item-name">Sleep Worthy Set</p>
                <button class="item-btn">Buy Now</button>
            </div>

            <div class="item-card">
                <img src="pngwing.com (3).png" alt="product">
                <p class="item-name">Fiery Red Headsets</p>
                <button class="item-btn">Buy Now</button>
            </div>

        </div>
    </section>


</div>

</body>
</html>
